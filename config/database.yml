default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: password
  port: 5432

development:
  <<: *default
  host: localhost
  database: sotsugyo_seisaku_development

test:
  <<: *default
  host: localhost
  database: sotsugyo_seisaku_test

production:
  primary:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>